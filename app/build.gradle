plugins {
    id 'com.android.application'
}

def nomor = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.luxio.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.luxio.launcher'
        minSdk 26
        targetSdk 34
        versionCode nomor
        versionName "2.0.$nomor"
    }

    // Kunci tanda tangan TIDAK ada di repo. GitHub Actions membuatnya dari secret
    // LUXIO_KEYSTORE_B64 + LUXIO_KEYSTORE_PASSWORD. Tanpa secret, build release memakai kunci debug
    // (hanya untuk uji lokal; APK itu tidak bisa menimpa versi resmi).
    def ksFile = file('luxio-release.jks')
    def ksPass = System.getenv('LUXIO_KEYSTORE_PASSWORD')
    signingConfigs {
        luxio {
            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias 'luxio'
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig(ksFile.exists() && ksPass ? signingConfigs.luxio : signingConfigs.debug) }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'webp', 'mp3', 'jpg', 'glb', 'woff2', 'lxw' }
    lint { checkReleaseBuilds false; abortOnError false }
}
